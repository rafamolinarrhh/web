<style>
/* Layout: mesa de cierre — barra con pestañas y selector de mes; cada vista es una lista de trabajo con estados visibles */

  --warn:#E6A650; --warn-soft:#33260F; --bad:#F08B81; --bad-soft:#3A1A17; --neutral-soft:#222C35; --info:#8DB6E6; --info-soft:#18283A;

<script>
/* ===== utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
function money(n){ n = r2(n); const neg = n < 0; n = Math.abs(n); let [i, d] = n.toFixed(2).split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '−' : '') + i + ',' + d + ' €'; }
const intf = n => Math.round(+n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const thisMonth = () => today().slice(0, 7);
const fdate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesLabel = m => MESES[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
const mesCorto = m => MESES[+m.slice(5, 7) - 1].slice(0, 3);
const prevMonth = m => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 2, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const lastDay = m => iso(new Date(+m.slice(0, 4), +m.slice(5, 7), 0));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { if (typeof v === 'number') return v; const s = String(v ?? '').trim().replace(/\s/g, ''); if (!s) return 0; const t = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s; const n = parseFloat(t); return isNaN(n) ? 0 : n; };
const strip = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const LEGAL = /\b(S\.?\s?L\.?\s?U\.?|S\.?\s?L\.?\s?P\.?|S\.?\s?L\.?|S\.?\s?A\.?\s?U\.?|S\.?\s?A\.?\s?D\.?|S\.?\s?A\.?|S\.?\s?C\.?\s?A\.?|C\.?\s?B\.?|S\.?\s?COOP\.?\s?(AND\.?)?|SOCIEDAD LIMITADA|SOCIEDAD ANONIMA)\s*$/i;
function normName(s){ let t = strip(s).toUpperCase().replace(/\s+/g, ' ').trim(); for (let k = 0; k < 2; k++) t = t.replace(/[,.\s]+$/, '').replace(LEGAL, '').trim(); return t.replace(/[^A-Z0-9]/g, ''); }
const normCif = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ===== estado ===== */
const S = { docs: new Map(), view: 'resumen', mes: thisMonth(), mode: 'loading', slow: false, err: null, q: '', editCli: null, dirty: false };
let DL = null;
const ID = () => { const c = cfg(); const marca = c.marca || c.nombre || 'Tu empresa'; return { nombre: c.nombre || marca, marca, nif: c.nif || '', dir: [c.direccion, [c.cp, c.poblacion].filter(Boolean).join(' '), c.provincia].filter(Boolean).join(', '), email: c.email || '', web: c.web || '', lema: c.lema || '', logo: c.logo || '' }; };
const logoHTML = () => { const i = ID(); return i.logo ? `<img src="${i.logo}" alt="" style="max-height:64px;max-width:240px">` : `<div style="font:800 20pt 'Plus Jakarta Sans',Arial,sans-serif;color:#2F5288">${esc(i.marca)}</div>`; };
const logoPDF = () => { const i = ID(); if (i.logo && i.logo.startsWith('data:image/svg')) { try { const b = i.logo.split(',')[1]; return { svg: i.logo.includes(';base64,') ? decodeURIComponent(escape(atob(b))) : decodeURIComponent(b), width: 165 }; } catch (e) {} } if (i.logo) return { image: i.logo, fit: [165, 52] }; return { text: i.marca, bold: true, fontSize: 18, color: '#2F5288', width: 165 }; };
const footTxt = () => { const i = ID(); return [i.web, i.email].filter(Boolean).join(' · '); };
const cfg = () => ({ precio: 3, coste: 1.5, iva: 21, irpfVentas: 0, comisionPct: 20, ivaComision: 21, irpfComision: 0, concepto: 'Créditos Time Laboris', desde: thisMonth(), seq: 'RCUR', esquema: 'CORE', ...(S.docs.get('ajustes') || {}) });
const clientes = () => [...S.docs.values()].filter(d => d.kind === 'cliente').sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));
const cliById = id => S.docs.get(id);
const mov = m => S.docs.get('mov_' + m) || { kind: 'mov', mes: m, recargas: [], compras: [], otras: [] };
const cierre = m => S.docs.get('cie_' + m) || { kind: 'cierre', mes: m, facturas: {}, comision: {} };
const remesas = () => [...S.docs.values()].filter(d => d.kind === 'remesa').sort((a, b) => (b.creada || '').localeCompare(a.creada || ''));
function meses(){

function cellDate(v){
  if (v == null || v === '') return null;
  if (Object.prototype.toString.call(v) === '[object Date]') return iso(new Date(v.getTime() + 12 * 3600e3));
  if (typeof v === 'number') return iso(new Date(Math.round((v - 25569) * 864e5) + 12 * 3600e3 + new Date().getTimezoneOffset() * 6e4));
  const m = String(v).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(m[2]) + '-' + pad(m[1]); }

}
function findHeader(rows, test){ for (let i = 0; i < Math.min(rows.length, 20); i++) { const h = (rows[i] || []).map(x => strip(x).toLowerCase().trim()); if (test(h)) return i; } return -1; }

  const nc = normCif(cif); if (nc) { const c = cs.find(x => normCif(x.cif) === nc); if (c) return c.id; }
  const nn = normName(nombre); if (nn) { const c = cs.find(x => normName(x.nombre) === nn || (x.alias || []).includes(nn)); if (c) return c.id; }
  return null;
}

    if (hi >= 0) {

      const seen = {};

        const con = ix.con >= 0 ? String(r[ix.con] ?? '').trim() : '', cr = Math.abs(num(r[ix.cr]));
        let nombre = ix.emp >= 0 ? String(r[ix.emp] ?? '').trim() : '', cif = ix.cif >= 0 ? normCif(r[ix.cif]) : '';

        const base = [fecha, con, nombre, cif, cr].join('|'); seen[base] = (seen[base] || 0) + 1; const id = 'p' + hash(base + '#' + seen[base]);

async function importClientes(list){
  let nuevos = 0, act = 0;
  modal('Importar clientes', `<p>${list.length} clientes en el archivo. Se añadirán los nuevos y se actualizarán los datos de los existentes. El IBAN, el mandato y el precio que hayas puesto aquí se conservan.</p>`, [{ label: 'Importar', cls: 'primary', on: async () => {
    toast('Importando clientes…');
    for (const c of list) {
      const id = c.codigo ? 'cli_' + c.codigo.replace(/[^A-Za-z0-9_\-.]/g, '') : (matchCli(c) || 'cli_' + (normCif(c.cif) || uid('x')));
      const prev = S.docs.get(id) || (matchCli(c) && S.docs.get(matchCli(c)));
      const doc = { kind: 'cliente', precio: '', iban: '', mandatoRef: '', mandatoFecha: '', alias: [], ...(prev || {}), ...Object.fromEntries(Object.entries(c).filter(([k, v]) => v !== '' && v != null && !(k === 'iban' && prev && prev.iban))) };
      if (!doc.mandatoRef && doc.codigo) doc.mandatoRef = 'TL-' + doc.codigo;
      prev ? act++ : nuevos++;
      if (!(await safe(() => Store.put(prev ? prev.id : id, doc)))) return;
    }
    toast(`${nuevos} clientes nuevos, ${act} actualizados`);
  } }]);
}
async function importMovs(r, origen){
  const byMes = {};
  const put = (arr, x) => { const m = x.fecha.slice(0, 7); (byMes[m] = byMes[m] || { recargas: [], compras: [], otras: [] })[arr].push(x); };
  r.recargas.forEach(x => put('recargas', { ...x, cli: matchCli(x), origen }));
  r.compras.forEach(x => put('compras', { ...x, precio: cfg().coste }));
  r.otras.forEach(x => put('otras', { ...x, cli: matchCli(x) }));
  let add = 0, sin = 0;
  for (const [m, d] of Object.entries(byMes)) {
    const cur = clone(mov(m)); cur.kind = 'mov'; cur.mes = m;
    for (const k of ['recargas', 'compras', 'otras']) { cur[k] = cur[k] || []; const ids = new Set(cur[k].map(x => x.id)); for (const x of d[k]) if (!ids.has(x.id)) { const o = { ...x }; delete o.codigo; if (k !== 'compras') o.cli = o.cli || null; cur[k].push(o); add++; if (k === 'recargas' && !o.cli) sin++; } }
    if (!(await safe(() => Store.put('mov_' + m, cur)))) return;
  }
  const ms = Object.keys(byMes).sort(); if (ms.length) S.mes = ms[ms.length - 1];
  toast(`${add} movimientos nuevos importados` + (sin ? ` · ${sin} recargas sin cliente asignado` : ''));
  render();
}

function chart(end){
  const ms = []; let m = end; for (let i = 0; i < 12; i++) { ms.unshift(m); m = prevMonth(m); }
  const data = ms.map(x => { const s = resumenMes(x); return { m: x, v: s.ventas, h: s.historico, mg: s.margen + s.comision }; });
  const W = 640, H = 230, L = 58, R = 10, T = 12, B = 26, max = niceMax(Math.max(...data.map(d => Math.max(d.v, d.mg)), 1));
  const cw = (W - L - R) / 12, bw = cw * .6, y = v => T + (H - T - B) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas y margen de los últimos 12 meses">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' k€' : Math.round(v) + ' €'}</text>`; }
  const pts = [];
  data.forEach((d, i) => { const x = L + i * cw + (cw - bw) / 2; if (d.v > 0) s += `<rect x="${x}" y="${y(d.v)}" width="${bw}" height="${y(0) - y(d.v)}" rx="2" fill="${d.h ? 'var(--line-strong)' : 'var(--accent)'}"><title>${mesLabel(d.m)}: ventas ${money(d.v)}, margen ${money(d.mg)}</title></rect>`; s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${d.m === end ? 'style="fill:var(--ink);font-weight:600"' : ''}>${mesCorto(d.m)}</text>`; pts.push([x + bw / 2, y(d.mg)]); });
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  pts.forEach((p, i) => s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === 11 ? 4 : 2.5}" fill="var(--ink)"/>`);
  return s + '</svg>';
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

/* ===== render ===== */
function render(){
  const sel = $('#sel-mes'); const ms = meses(); sel.innerHTML = ms.map(m => `<option value="${m}" ${m === S.mes ? 'selected' : ''}>${mesLabel(m)}</option>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.dataset.nav === S.view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (S.dirty && (S.view === 'ajustes' || S.view === 'escala' || (S.view === 'presupuestos' && (S.editPre || PRE.cat)) || (S.view === 'clientes' && S.editCli))) return;

const M365 = 'Microsoft 365';
let MCP = null;
const odCfg = () => S.docs.get('onedrive') || null;
const odName = s => String(s || '').replace(/[\\/:*?"<>|#%]/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '').slice(0, 100) || 'Sin nombre';
const mcpText = r => { const t = ((r && r.content) || []).filter(c => c && typeof c.text === 'string').map(c => c.text).join('\n'); if (t) return t; const p = r && r.payload; return typeof p === 'string' ? p : p ? JSON.stringify(p) : ''; };
const urlKey = u => { try { u = decodeURIComponent(u); } catch (e) {} return u.replace(/\/+$/, '').toLowerCase(); };
function mcpMsg(e){
  const c = e && e.code;
  if (c === 'needs_reauth') return 'Vuelve a conectar Microsoft 365 en claude.ai → Ajustes → Conectores.';
  if (c === 'server_not_connected' || c === 'selection_required') return 'Conecta Microsoft 365 en claude.ai → Ajustes → Conectores.';
  if (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') return 'Hace falta que permitas a esta página usar Microsoft 365: vuelve a pulsar el botón y acepta el aviso.';
  if (c === 'blocked_by_policy') return 'Tu organización no permite esta acción de Microsoft 365.';
  if (c === 'tool_error') return 'OneDrive respondió con un error: ' + String(e.message || '').slice(0, 160);
  return 'No se pudo conectar con OneDrive. Comprueba si el archivo llegó antes de repetir.';
}
async function odReady(){
  if (!odCfg()) throw { code: 'local', message: 'Falta la configuración de la carpeta de OneDrive. Pídemela en el chat.' };
  if (!MCP && window.claude && window.claude.use) { try { MCP = await window.claude.use('mcp'); } catch (e) {} }
  if (!MCP) throw { code: 'local', message: 'Guardar en OneDrive no está disponible en la versión web.' };
  return MCP;
}
async function odFolder(parent, name){
  const cfg = odCfg(), m = await odReady(); name = odName(name);
  try {
    const t = mcpText(await m.callTool(M365, 'sharepoint_create_folder', { driveId: cfg.driveId, parentItemId: parent.id, name }));
    const id = (t.match(/itemId:\s*(\S+)/) || [])[1];
    if (id) return { id, url: (t.match(/webUrl:\s*(\S+)/) || [])[1] || parent.url + '/' + encodeURIComponent(name) };
    throw { code: 'tool_error', message: t };
  } catch (e) {
    if (!e || e.code !== 'tool_error') throw e;
    const want = urlKey(parent.url + '/' + name), t = mcpText(await m.callTool(M365, 'sharepoint_folder_search', { name, limit: 50 }, { cache: false }));
    const re = /"id":"([^"]+)","name":"[^"]*","webUrl":"([^"]+)"/g; let x;
    while ((x = re.exec(t))) if (urlKey(x[2]) === want) return { id: x[1], url: x[2] };
    throw e;
  }
}
const blobB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
async function odUpload(folder, filename, blob){
  const cfg = odCfg(), m = await odReady();
  if (blob.size > 1000000) throw { code: 'local', message: 'El archivo pasa de 1 MB y OneDrive no lo admite por esta vía.' };
  const t = mcpText(await m.callTool(M365, 'sharepoint_upload_file', { driveId: cfg.driveId, parentItemId: folder.id, filename, contentBase64: await blobB64(blob), conflictBehavior: 'replace' }));
  return (t.match(/webUrl:\s*(\S+)/) || [])[1] || folder.url;
}

async function odAseFolder(a, sub){

function acuDist(){ const i = ID(); return { rep: i.nombre, dni: i.nif || '____________', entidad: i.marca, dom: i.dir || '____________________', firma: i.nombre }; }

    { k: 'h2', text: 'Portal del empleado con registro de la jornada laboral' },

  for (let y = lo; y <= hi + 1e-6; y += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L - 8}" y="${Y(y) + 4}" text-anchor="end">${Math.abs(y) >= 1000 ? (y / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' k€' : Math.round(y) + ' €'}</text>`;
  for (let x = 0; x <= maxX; x += 500) s += `<text x="${X(x)}" y="${H - 8}" text-anchor="middle">${intf(x)}</text>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${Y(v.actual)}" y2="${Y(v.actual)}" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${W - R}" y="${Y(v.actual) - 6}" text-anchor="end">hoy ${money(v.actual)}</text>`;
  s += `<polyline points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  const cx = Math.min(v.cred, maxX), cy = simCalc(v).neto; s += `<circle cx="${X(cx)}" cy="${Y(cy)}" r="5" fill="var(--ink)"/><text x="${X(cx) + 8}" y="${Y(cy) + 16}" style="fill:var(--ink)">${intf(v.cred)} cr.</text>`;
  return s + '</svg>';
}

/* Colección en Supabase con la misma forma que usa la app: doc(id).set / delete y onSnapshot. */
function cloudCol(sb, uid){
  const cache = new Map(), subs = [];
  const emit = () => { const snap = { metadata: { fromCache: false }, docs: [...cache].map(([id, d]) => ({ id, data: () => d })) }; subs.forEach(cb => cb(snap)); };
  const fail = e => { const st = e && (e.status || e.code); const code = (st === 401 || st === 403 || st === '42501') ? 'invalid_argument' : (st === 413 || st === '54000') ? 'quota_exceeded' : 'unavailable'; const x = new Error(e && e.message || 'Error'); x.code = code; return x; };
  return {
    doc: id => ({
      async set(body){ const { error } = await sb.from('docs').upsert({ owner: uid, id, data: body, updated_at: new Date().toISOString() }, { onConflict: 'owner,id' }); if (error) throw fail(error); cache.set(id, body); emit(); },
      async delete(){ const { error } = await sb.from('docs').delete().eq('owner', uid).eq('id', id); if (error) throw fail(error); cache.delete(id); emit(); }
    }),
    onSnapshot(cb, errCb){
      subs.push(cb);
      (async () => {
        for (let from = 0; ; from += 1000) {
          const { data, error } = await sb.from('docs').select('id,data').eq('owner', uid).range(from, from + 999);
          if (error) throw error;
          data.forEach(r => cache.set(r.id, r.data));
          if (data.length < 1000) break;
        }
        emit();
        sb.channel('docs-' + uid).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'owner=eq.' + uid }, ch => {
          if (ch.eventType === 'DELETE') cache.delete(ch.old.id); else cache.set(ch.new.id, ch.new.data);
          emit();
        }).subscribe();
      })().catch(e => errCb && errCb(fail(e)));
    }
  };
}

async function init(){
  const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h;
  S.mode = 'loading'; render();
  if (/[?&]demo\b/.test(location.search)) { $('#who').innerHTML = ''; return startDemo(); }
  if (!CLOUD) { authView('login'); return; }
  SB = window.supabase.createClient(CONF.supabaseUrl, CONF.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });
  SB.auth.onAuthStateChange((ev, session) => { if (ev === 'PASSWORD_RECOVERY') { SESSION = session; authView('setpw'); } if (ev === 'SIGNED_OUT') { SESSION = null; } });
  const { data } = await SB.auth.getSession();
  if (!data.session) return authView('login');
  SESSION = data.session;
  if (HASH_TYPE === 'invite' || HASH_TYPE === 'recovery') return authView('setpw');
  startCloud(data.session);
}
